# Typecheck + unit tests on every push and PR.
#
# Deliberately does NOT run the E2E: it invokes real Bedrock models, so it needs AWS
# credentials and costs money per run. CONTRIBUTING.md asks contributors to run
# `npm run e2e:local` themselves for anything touching the runtime, invoke, or
# trajectory paths - this workflow proves the parts that can be checked for free.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `ci`, not `install`: fail if the lockfile and package.json disagree.
      - run: npm ci
      - run: npm run typecheck
      # No AWS credentials exist here, and that's the point: the suite must be hermetic.
      # A latent bug once made buildDeps hand tests the REAL AWS clients, so 8 tests passed
      # only on a machine that happened to have credentials. Disabling the metadata endpoint
      # too, so a runner with an instance role can't mask the same class of bug.
      - run: npm test
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
      # The deploy-scope rule decides whether a backend change gets deployed at all, so its
      # tests run here too - a wrong answer there is silent. Same for preview-scope, which
      # decides whether a PR can be honestly represented by an SPA-only preview, and for
      # stack-outputs, which every deploy path starts with: it once exited 254 on a stack
      # that didn't exist yet and took the whole deploy with it.
      - run: bash .github/scripts/deploy-scope.test.sh
      - run: bash .github/scripts/preview-scope.test.sh
      - run: bash .github/scripts/stack-outputs.test.sh
